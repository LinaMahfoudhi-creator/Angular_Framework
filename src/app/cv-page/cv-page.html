<div class="bg-body-secondary min-vh-100 p-3">
  <div class="container">
    <div class="row g-3">
      <div class="col-md-5">
        <app-cv-list
          [cvs]="cvs()"
          [selectedId]="selectedCv()?.id ?? null"
          (selected)="onSelect($event)"
        />
      </div>
      <div class="col-md-7">
        <app-cv-detail [cv]="selectedCv()" />
      </div>
    </div>

    <div class="mt-4">
      <app-cv-embauches />
    </div>
  </div>
</div>

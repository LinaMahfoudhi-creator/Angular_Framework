<div
  class="card card-body flex-row align-items-center gap-3 py-2"
  role="button"
  [class.bg-primary-subtle]="actif()"
  [class.border-primary]="actif()"
  (click)="select()"
>
  <img [src]="cv().path" [alt]="cv().firstname" width="48" height="48" class="rounded-circle object-fit-cover" />
  <span>{{ cv().firstname }} {{ cv().name }}</span>
</div>

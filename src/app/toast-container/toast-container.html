<div class="position-fixed top-0 end-0 p-3" style="z-index: 1100">
  @for (t of toasts(); track t.id) {
    <div class="toast show d-flex align-items-center border-0 mb-2" [class]="'text-bg-' + t.type">
      <div class="toast-body">{{ t.message }}</div>
      <button class="btn-close btn-close-white ms-auto me-2" (click)="close(t.id)" aria-label="Fermer"></button>
    </div>
  }
</div>

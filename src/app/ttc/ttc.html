<div class="container-fluid bg-body-secondary p-3">
  <h2>TTC Calculator</h2>

  <div class="row mb-3">
    <div class="col">
      <input type="number" class="form-control" [(ngModel)]="prixHT" />
      <small>Prix HT</small>
    </div>
    <div class="col">
      <input type="number" class="form-control" [(ngModel)]="quantite" />
      <small>Quantité</small>
    </div>
    <div class="col">
      <input type="number" class="form-control" [(ngModel)]="tva" />
      <small>TVA</small>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <div class="alert alert-info">Prix unitaire TTC : {{ prixUnitaireTTC() | currency: 'USD' }}</div>
    </div>
    <div class="col">
      <div class="alert alert-success">Prix total TTC : {{ prixTotalTTC() | currency: 'USD' }}</div>
    </div>
    <div class="col">
      <div class="alert alert-danger">Discount : {{ remise() | currency: 'USD' }}</div>
    </div>
  </div>
</div>
